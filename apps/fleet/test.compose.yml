name: simu-fleet-test
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: isolated-fleet-test
      POSTGRES_DB: fleet
    healthcheck:
      test: [CMD-SHELL, pg_isready -U fleet -d fleet]
      interval: 1s
      timeout: 3s
      retries: 30
  tests:
    build:
      context: ../..
      dockerfile: apps/fleet/Dockerfile
    image: logistics-simulator:fleet-test
    environment:
      TEST_DATABASE_URL: postgresql://fleet:isolated-fleet-test@db:5432/fleet
    volumes:
      - ./backend:/app/fleet:ro
      - ./tests:/app/tests:ro
      - ./migrations:/app/migrations:ro
      - ../../contracts:/app/contracts:ro
      - ../../scripts:/app/scripts:ro
    depends_on:
      db:
        condition: service_healthy
    command: [pytest, -q, -p, 'no:cacheprovider', tests]
